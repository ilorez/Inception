bind 0.0.0.0
protected-mode no
port 6379

daemonize no
loglevel notice
logfile ""

maxmemory 100mb
maxmemory-policy allkeys-lru

# pure object cache — no durability needed, WordPress just repopulates it
save ""
# save "": this mean that Redis will not save the dataset to disk, which is suitable for caching purposes where persistence is not required.
appendonly no
# mechanism for persisting data to disk, which is not needed for caching purposes.
